[project]
name = "emake"
version = "2.0.1"
description = "Easy wrapper around CMake's CLI"
readme = "README.md"
authors = [
    { name = "Jon Palmisciano", email = "jp@jonpalmisc.com" }
]
requires-python = ">=3.11"
dependencies = [
    "python-benedict>=0.35.0",
    "typer>=0.20.0",
]

[dependency-groups]
dev = [
    "ruff>=0.14.10",
]

[project.scripts]
emake = "emake.cli.emake:main"
econf = "emake.cli.econf:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.ruff.lint]
select = [
    "A",
    "ANN",
    "ARG",
    "B",
    "BLE",
    "C4",
    "C90",
    "E",
    "F",
    "FURB",
    "I",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "PD",
    "PERF",
    "PGH",
    "PIE",
    "PLC",
    "PT",
    "PTH",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "SIM",
    "TID",
    "TC",
    "UP",
    "W",
]
