[project]
name = "emake"
version = "0.1.0"
description = "Easy wrapper around CMake's CLI"
readme = "README.md"
authors = [
    { name = "Jon Palmisciano", email = "jp@jonpalmisc.com" }
]
requires-python = ">=3.9"
dependencies = [
    "python-benedict>=0.35.0",
    "tomli>=2.3.0",
    "typer>=0.20.0",
]

[project.scripts]
emake = "emake.cli.emake:main"
econf = "emake.cli.econf:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"
